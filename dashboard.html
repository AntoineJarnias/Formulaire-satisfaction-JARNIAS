<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex" />
<title>Tableau de bord — Jarnias</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">

  <div class="header">
    <img src="logo.png" alt="Jarnias, les experts de la hauteur" />
  </div>

  <!-- Ecran de connexion -->
  <form id="login-form" class="card login-card">
    <h1>Connexion — Espace Jarnias</h1>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required />
    </div>
    <div class="field" style="margin-bottom:0;">
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" required />
    </div>
    <div id="login-status" class="status-msg error" hidden></div>
    <div class="submit-row">
      <button type="submit" class="primary">Se connecter</button>
    </div>
  </form>

  <!-- Tableau de bord (visible une fois connecte) -->
  <section id="dashboard" hidden>
    <div class="card" style="display:flex; flex-direction:column; gap:20px;">
      <div class="toolbar">
        <h2 class="section-title">Tableau de bord satisfaction</h2>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <select id="period-filter">
            <option value="all">Toutes les réponses</option>
            <option value="30">30 derniers jours</option>
            <option value="90">90 derniers jours</option>
          </select>
          <button type="button" class="ghost" id="export-csv-btn">Exporter en CSV</button>
          <button type="button" class="ghost" id="logout-btn">Se déconnecter</button>
        </div>
      </div>
      <div id="dash-stats" class="stat-grid"></div>
      <div id="dash-bars"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Chantier</th><th>Entreprise</th><th>Nom</th><th>Présent</th><th>Note</th><th>Commentaire</th></tr>
          </thead>
          <tbody id="dash-table-body"></tbody>
        </table>
      </div>
      <div id="dash-empty" class="empty-state" hidden>Aucune réponse pour le moment.</div>
    </div>
  </section>

  <footer>Jarnias — Les experts de la hauteur</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://jaxvxmxumqqiaxztjnog.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpheHZ4bXh1bXFxaWF4enRqbm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODUwOTIsImV4cCI6MjEwMzk2MTA5Mn0.x1odY-__nHZl4NQYfaqi63upJe6OhrV-KuTQmUbm8wU";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Criteres "toujours" notes par tout le monde, et criteres "conditionnels"
  // (uniquement notes par les clients qui etaient presents sur le chantier).
  const CONDITIONAL_CRITERIA = [
    { key: "communication_avant", label: "Communication avant le chantier" },
    { key: "securite", label: "Sécurité sur le chantier" },
    { key: "adaptation", label: "Capacité à s'adapter aux imprévus" },
    { key: "accueil", label: "Accueil et écoute de l'équipe sur place" }
  ];
  const ALWAYS_CRITERIA = [
    { key: "qualite", label: "Qualité et finition du travail réalisé" },
    { key: "recommandation", label: "Recommanderiez-vous Jarnias ?" }
  ];
  const ALL_CRITERIA = CONDITIONAL_CRITERIA.concat(ALWAYS_CRITERIA);

  const loginForm = document.getElementById("login-form");
  const loginStatus = document.getElementById("login-status");
  const dashboard = document.getElementById("dashboard");

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      showDashboard();
    } else {
      loginForm.hidden = false;
      dashboard.hidden = true;
    }
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginStatus.hidden = true;
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      loginStatus.textContent = "Connexion impossible : email ou mot de passe incorrect.";
      loginStatus.hidden = false;
      return;
    }
    showDashboard();
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    loginForm.hidden = false;
    dashboard.hidden = true;
  });

  function showDashboard() {
    loginForm.hidden = true;
    dashboard.hidden = false;
    loadResponses();
  }

  let allResponses = [];

  async function loadResponses() {
    const { data, error } = await supabaseClient
      .from("reponses")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }
    allResponses = data;
    renderDashboard();
  }

  document.getElementById("period-filter").addEventListener("change", renderDashboard);

  function filteredResponses() {
    const period = document.getElementById("period-filter").value;
    if (period === "all") return allResponses;
    const days = parseInt(period, 10);
    const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    return allResponses.filter((r) => new Date(r.created_at).getTime() >= cutoff);
  }

  function badgeClass(v) {
    if (v >= 4) return "good";
    if (v >= 3) return "warn";
    return "bad";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function renderDashboard() {
    const list = filteredResponses();
    const count = list.length;
    const globalAvg = count ? Math.round((list.reduce((s, r) => s + Number(r.moyenne), 0) / count) * 10) / 10 : 0;

    document.getElementById("dash-stats").innerHTML =
      `<div class="stat-card"><div class="value">${count}</div><div class="label">Réponses reçues</div></div>` +
      `<div class="stat-card"><div class="value">${count ? globalAvg.toFixed(1) : "—"} / 5</div><div class="label">Note moyenne globale</div></div>`;

    // Pour les criteres conditionnels, on ne moyenne que les reponses
    // qui les ont effectivement renseignes (client present sur le chantier).
    document.getElementById("dash-bars").innerHTML = ALL_CRITERIA.map((c) => {
      const answered = list.filter((r) => r[c.key] !== null && r[c.key] !== undefined);
      const n = answered.length;
      const avg = n ? answered.reduce((s, r) => s + Number(r[c.key]), 0) / n : 0;
      const pct = (avg / 5 * 100).toFixed(0);
      const suffix = CONDITIONAL_CRITERIA.some((cc) => cc.key === c.key) ? ` (${n} avis)` : "";
      return `<div class="bar-row"><div class="bar-label">${c.label}${suffix}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-value">${n ? avg.toFixed(1) : "—"}</div></div>`;
    }).join("");

    const tbody = document.getElementById("dash-table-body");
    const emptyEl = document.getElementById("dash-empty");

    if (count === 0) {
      tbody.innerHTML = "";
      emptyEl.hidden = false;
    } else {
      emptyEl.hidden = true;
      tbody.innerHTML = list.map((r) => {
        const d = new Date(r.created_at);
        const dateStr = d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
        return `<tr>
          <td>${dateStr}</td>
          <td>${escapeHtml(r.chantier || "—")}</td>
          <td>${escapeHtml(r.entreprise || "—")}</td>
          <td>${escapeHtml(r.nom || "—")}</td>
          <td>${r.present ? "Oui" : "Non"}</td>
          <td class="num"><span class="badge ${badgeClass(r.moyenne)}">${Number(r.moyenne).toFixed(1)}</span></td>
          <td class="comment-cell">${escapeHtml(r.commentaire || "—")}</td>
        </tr>`;
      }).join("");
    }
  }

  document.getElementById("export-csv-btn").addEventListener("click", () => {
    const list = filteredResponses().slice().reverse();
    const header = ["Date", "Chantier", "Entreprise", "Nom", "Present", "Communication avant", "Securite", "Adaptation", "Accueil", "Qualite", "Recommandation", "Moyenne", "Commentaire"];
    const rows = list.map((r) => [
      new Date(r.created_at).toLocaleDateString("fr-FR"),
      r.chantier || "", r.entreprise || "", r.nom || "",
      r.present ? "Oui" : "Non",
      r.communication_avant ?? "", r.securite ?? "", r.adaptation ?? "", r.accueil ?? "",
      r.qualite, r.recommandation,
      r.moyenne, (r.commentaire || "").replace(/\n/g, " ")
    ]);
    function csvEscape(v) {
      v = String(v);
      if (/^[=+\-@]/.test(v)) v = "'" + v;
      if (/[",;\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
      return v;
    }
    const csv = [header].concat(rows).map((row) => row.map(csvEscape).join(";")).join("\r\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "satisfaction-jarnias.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  checkSession();
</script>
</body>
</html>
